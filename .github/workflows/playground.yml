name: Build hbbs authenticated handshake for Synology
'on':
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk-server
          ref: 9bae9f2f39d92c4b4ba2e28e089da5071897b22e
          submodules: recursive
          path: server
          persist-credentials: false
      - name: Apply handshake patch
        working-directory: server
        run: git apply --check ../custom-server/handshake.patch && git apply ../custom-server/handshake.patch
      - name: Install native and musl dependencies
        run: sudo apt-get update -q && sudo apt-get install -y musl-tools pkg-config libssl-dev build-essential
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.1
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          key: hbbs-account-handshake-musl
      - name: Test handshake and compatibility
        working-directory: server
        run: 'cargo test --locked --lib handshake:: -- --nocapture'
      - name: Build static Synology binaries
        working-directory: server
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --locked --release --target x86_64-unknown-linux-musl --bin hbbs --bin hbbr
      - name: Verify static binaries
        run: |
          file server/target/x86_64-unknown-linux-musl/release/hbbs
          server/target/x86_64-unknown-linux-musl/release/hbbs --version
          server/target/x86_64-unknown-linux-musl/release/hbbr --version
      - uses: actions/upload-artifact@v4
        with:
          name: synology-hbbs-hbbr-handshake-x64
          path: |
            server/target/x86_64-unknown-linux-musl/release/hbbs
            server/target/x86_64-unknown-linux-musl/release/hbbr
          if-no-files-found: error
          retention-days: 14
